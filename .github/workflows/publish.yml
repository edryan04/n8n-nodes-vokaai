name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for re-publishing if a tag-driven run fails partway
  workflow_dispatch:

permissions:
  # Required for npm trusted publishing (OIDC) and the provenance attestation
  id-token: write
  contents: read

jobs:
  publish:
    name: Build + Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.14'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Pinned to 11 so npm 12's
        # install-time defaults don't change the build unannounced.
        run: npm install -g npm@11

      - name: Install
        # See ci.yml — skip native compile of isolated-vm; only types needed.
        run: npm ci --ignore-scripts

      - name: Lint (prepublish profile)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        # Authenticates through npm trusted publishing (OIDC): no token secret.
        # Configured on npmjs.com > n8n-nodes-vokaai > Settings > Trusted Publisher
        # for edryan04/n8n-nodes-vokaai, workflow publish.yml, no environment.
        run: npm publish --provenance --access public
