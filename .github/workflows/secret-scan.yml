name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily catch-up scan in case of historical leaks introduced before this workflow.
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so PR scans see the complete diff
          fetch-depth: 0

      # gitleaks CLI (MIT, no licence), checksum-verified. Replaces
      # gitleaks/gitleaks-action, which needs a paid licence once this repo is
      # owned by an organization. Pushes and PRs scan only their new commits;
      # the weekly scheduled run scans the full history.
      - name: Install gitleaks 8.30.0
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz

      - name: Run Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          CFG=""; [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run: scanning full history"
            ./gitleaks git . $CFG --redact --verbose --exit-code 1
            exit $?
          fi
          if [ "$EVENT" = "pull_request" ]; then RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then RANGE="$BEFORE..$SHA"
          else RANGE="$SHA~1..$SHA"; fi
          echo "Scanning $RANGE"
          ./gitleaks git . $CFG --redact --verbose --exit-code 1 --log-opts="$RANGE"
